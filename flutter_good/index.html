<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一计 - 协议与政策中心 | Flutter Good Legal Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2D3561, #FF6B6B);
      border-radius: 14px;
      font-size: 24px;
      color: #FFFFFF;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(45, 53, 97, 0.25);
    }
    h1 {
      font-size: 1.45rem;
      color: #0F172A;
      margin: 0 0 6px 0;
      font-weight: 700;
    }
    p.desc {
      font-size: 0.92rem;
      color: #64748B;
      margin: 0 0 28px 0;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin-bottom: 14px;
    }
    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F1F4F9;
      color: #2D3561;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    a:hover {
      background: #2D3561;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(45, 53, 97, 0.25);
    }
    .tag {
      font-size: 0.8rem;
      opacity: 0.85;
      font-weight: normal;
    }
    .home-link {
      display: block;
      text-align: center;
      margin-top: 26px;
      color: #94A3B8;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .home-link:hover {
      color: #2D3561;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align: center;">
      <div class="badge">计</div>
      <h1>一计 · 生活与生辰记录</h1>
      <p class="desc">法律条款、合规声明与隐私保护政策</p>
    </div>

    <ul>
      <li>
        <a href="privacy.html">
          <span>🔒 隐私保护政策</span>
          <span class="tag">Privacy Policy &rarr;</span>
        </a>
      </li>
      <li>
        <a href="terms.html">
          <span>📄 用户服务协议</span>
          <span class="tag">Terms of Service &rarr;</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
