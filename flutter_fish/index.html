<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鱼来哒 - 协议与政策中心 | Flutter Fish Legal Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #F0F9FF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #BAE6FD;
      border-radius: 20px;
      padding: 38px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(2, 132, 199, 0.08);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #0284C7, #06B6D4);
      border-radius: 14px;
      font-size: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
    }
    h1 {
      font-size: 1.4rem;
      color: #0C4A6E;
      margin: 0 0 6px 0;
      font-weight: 700;
    }
    p.desc {
      font-size: 0.9rem;
      color: #0369A1;
      margin: 0 0 26px 0;
      line-height: 1.5;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin-bottom: 14px;
    }
    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F0F9FF;
      color: #0369A1;
      border: 1px solid #BAE6FD;
      padding: 15px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    a:hover {
      background: #0284C7;
      color: #FFFFFF;
      border-color: #0284C7;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
    }
    .tag {
      font-size: 0.8rem;
      opacity: 0.85;
      font-weight: normal;
    }
    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.8rem;
      color: #64748B;
      border-top: 1px solid #E0F2FE;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🎣</div>
    <h1>鱼来哒</h1>
    <p class="desc">智能海钓、潮汐气象与出钓记录<br>用户服务协议与隐私保护政策中心</p>
    <ul>
      <li>
        <a href="privacy.html">
          <span>🔒 隐私保护政策</span>
          <span class="tag">Privacy Policy &rarr;</span>
        </a>
      </li>
      <li>
        <a href="terms.html">
          <span>📋 用户服务协议</span>
          <span class="tag">Terms of Service &rarr;</span>
        </a>
      </li>
    </ul>
    <footer>
      宜昌春末夏初科技有限公司 &copy; 2026 保留所有权利
    </footer>
  </div>
</body>
</html>
