<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行伴侣 - 协议与政策中心 | Flutter Travel Legal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 18px;
      padding: 38px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #FF2442, #FF6B81);
      border-radius: 12px;
      font-size: 22px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.35rem;
      color: #0F172A;
      margin: 0 0 6px 0;
      font-weight: 700;
    }
    p.desc {
      font-size: 0.9rem;
      color: #64748B;
      margin: 0 0 24px 0;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin-bottom: 14px;
    }
    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFF5F6;
      color: #C0152F;
      border: 1px solid #FFE0E3;
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    a:hover {
      background: #FF2442;
      color: #FFFFFF;
      border-color: #FF2442;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 36, 66, 0.25);
    }
    .tag {
      font-size: 0.8rem;
      opacity: 0.8;
      font-weight: normal;
    }
    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.8rem;
      color: #94A3B8;
      border-top: 1px solid #F1F5F9;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">✈️</div>
    <h1>旅行伴侣</h1>
    <p class="desc">用户服务协议与隐私保护政策中心</p>
    <ul>
      <li>
        <a href="privacy.html">
          <span>🔒 隐私保护政策</span>
          <span class="tag">Privacy Policy</span>
        </a>
      </li>
      <li>
        <a href="terms.html">
          <span>📋 用户服务协议</span>
          <span class="tag">Terms of Service</span>
        </a>
      </li>
    </ul>
    <footer>
      春末夏初科技有限公司 &copy; 2026 保留所有权利
    </footer>
  </div>
</body>
</html>
